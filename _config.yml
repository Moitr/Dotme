# Site
title: About Moitr
language: zh-CN
timezone: Asia/Shanghai

# GitHub Pages
url: https://moitr.cc
root: /
permalink: archives/:title/

# Code highlighting
highlight:
  line_number: false
  wrap: false
  hljs: true

# Keep article images out of the initial render path until they approach the viewport.
marked:
  lazyload: true

# Keep the main archive index; posts use /archives/:slug/.
archive_generator:
  yearly: false

theme: between
